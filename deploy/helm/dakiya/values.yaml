api:
  image: dakiya/api
  tag: latest
  replicas: 2

worker:
  image: dakiya/worker
  tag: latest
  replicas: 3

postgres:
  image: postgres:latest
  user: dakiya
  # The password is not stored here. Create the Secret before installing:
  #   kubectl create secret generic dakiya-db --from-literal=password="$(openssl rand -hex 16)"
  existingSecret: dakiya-db
  database: dakiya

redis:
  image: redis:latest
