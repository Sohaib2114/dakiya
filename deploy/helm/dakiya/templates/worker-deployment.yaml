apiVersion: apps/v1
kind: Deployment
metadata:
  name: dakiya-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: dakiya-worker
  template:
    metadata:
      labels:
        app: dakiya-worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "dakiya.image" (dict "root" . "name" "worker") }}
          envFrom:
            - configMapRef:
                name: dakiya-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: password
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- include "dakiya.containerSecurity" . | nindent 10 }}
