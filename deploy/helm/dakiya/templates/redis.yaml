# Redis is the queue between api and worker. appendonly + a volume keep accepted
# scans that the worker has not processed yet when Redis restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dakiya-redis
spec:
  serviceName: dakiya-redis
  replicas: 1
  selector:
    matchLabels:
      app: dakiya-redis
  template:
    metadata:
      labels:
        app: dakiya-redis
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            runAsUser: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: dakiya-redis
spec:
  selector:
    app: dakiya-redis
  ports:
    - name: redis
      port: 6379
