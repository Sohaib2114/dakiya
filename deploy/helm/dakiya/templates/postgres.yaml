# StatefulSet + PersistentVolumeClaim: the data survives pod restarts and rescheduling
# (the old chart used emptyDir, which is deleted with the pod).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dakiya-postgres
spec:
  serviceName: dakiya-postgres
  replicas: 1
  selector:
    matchLabels:
      app: dakiya-postgres
  template:
    metadata:
      labels:
        app: dakiya-postgres
    spec:
      securityContext:
        fsGroup: 999   # the "postgres" user in the image can write the volume
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            runAsUser: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: dakiya-postgres
spec:
  selector:
    app: dakiya-postgres
  ports:
    - name: postgres
      port: 5432
