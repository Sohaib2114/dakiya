apiVersion: apps/v1
kind: Deployment
metadata:
  name: dakiya-api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0   # start a new pod and wait until it is ready before stopping an old one
      maxSurge: 1
  selector:
    matchLabels:
      app: dakiya-api
  template:
    metadata:
      labels:
        app: dakiya-api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # When a pod stops, it is removed from the Service and told to stop at the same time.
      # The ingress needs a few seconds to notice, so the pod keeps serving 5s before it stops.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: {{ include "dakiya.image" (dict "root" . "name" "api") }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: dakiya-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: password
          # alive? restart the pod if not
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          # can reach postgres and redis? take it out of the Service if not
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "dakiya.containerSecurity" . | nindent 10 }}
