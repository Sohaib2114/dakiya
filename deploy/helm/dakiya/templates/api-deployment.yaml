apiVersion: apps/v1
kind: Deployment
metadata:
  name: dakiya-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: dakiya-api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: dakiya/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: dakiya-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: password
